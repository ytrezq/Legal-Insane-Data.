name: Régénération de la carte

# Après une modification du jeu de données sur la branche francais : recalcul des champs dérivés et
# régénération de la carte (SVG + JPG de 10 mégapixels), puis commit du résultat.
on:
  push:
    branches: [francais]
    paths:
      - "donnees/irresponsabilite_penale.json"

permissions:
  contents: write

concurrency:
  group: carte-francais
  cancel-in-progress: false

jobs:
  construire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer Pillow
        run: python3 -m pip install --quiet pillow

      - name: Recalculer les champs dérivés
        run: python3 outils/donnees.py rafraichir donnees/irresponsabilite_penale.json --geo outils/geo/admin1_sous_ensemble.geojson

      - name: Construire la carte
        run: sh outils/construire.sh

      - name: Enregistrer les fichiers régénérés
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add donnees/irresponsabilite_penale.json cartes/
          if git diff --cached --quiet; then
            echo "Rien à enregistrer."
          else
            git commit -m "Régénération des champs dérivés et de la carte"
            git push
          fi
